<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>VIP Card Draw | Win Up to ZMW 1,000 Off</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #0d3b2e 0%, #051b14 60%, #020d09 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px 16px;
      overflow-x: hidden;
    }

    .header {
      text-align: center;
      max-width: 420px;
      margin-bottom: 16px;
    }

    .badge {
      display: inline-block;
      background: rgba(212, 175, 55, 0.15);
      border: 1px solid rgba(212, 175, 55, 0.45);
      color: #f3d266;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 50px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff6d1 0%, #d4af37 50%, #aa8220 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #b8d0c7;
      line-height: 1.4;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 360px;
      margin: 12px auto;
      perspective: 1000px;
    }

    .card {
      aspect-ratio: 3 / 4;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card.dimmed {
      opacity: 0.35;
      pointer-events: none;
      transform: scale(0.95);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      text-align: center;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45);
    }

    .card-front {
      background: linear-gradient(145deg, #104938, #07261d);
      border: 2px solid #d4af37;
    }

    .card-front::before {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1px dashed rgba(212, 175, 55, 0.45);
      border-radius: 10px;
    }

    .card-icon {
      font-size: 32px;
      margin-bottom: 8px;
      filter: drop-shadow(0 2px 6px rgba(212, 175, 55, 0.4));
    }

    .card-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      color: #f3d266;
      text-transform: uppercase;
    }

    .card-back {
      background: linear-gradient(145deg, #fffdf5 0%, #f5e6b3 100%);
      color: #062119;
      border: 3px solid #d4af37;
      transform: rotateY(180deg);
    }

    .win-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #0d4a38;
      margin-bottom: 4px;
    }

    .win-amount {
      font-size: 24px;
      font-weight: 900;
      color: #051b14;
      line-height: 1.1;
    }

    .win-off {
      font-size: 13px;
      font-weight: 800;
      color: #b38416;
      margin-top: 2px;
    }

    .result-box {
      display: none;
      width: 100%;
      max-width: 360px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(212, 175, 55, 0.5);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
      margin-top: 12px;
      backdrop-filter: blur(8px);
      animation: fadeUp 0.5s ease forwards;
    }

    .result-box.visible {
      display: block;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .voucher-label {
      font-size: 11px;
      color: #b8d0c7;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .voucher-code {
      font-family: monospace;
      font-size: 20px;
      font-weight: 800;
      color: #f3d266;
      background: rgba(0, 0, 0, 0.35);
      padding: 8px 14px;
      border-radius: 8px;
      margin: 8px 0;
      letter-spacing: 1.5px;
      border: 1px dashed rgba(212, 175, 55, 0.5);
    }

    .live-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #6ee7b7;
      background: rgba(16, 185, 129, 0.12);
      padding: 4px 10px;
      border-radius: 20px;
      margin-top: 4px;
    }

    .dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.8); }
    }

    .terms {
      font-size: 11px;
      color: #8aa89d;
      margin-top: 10px;
    }

    .footer {
      width: 100%;
      max-width: 360px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      font-size: 11px;
      color: #5c7a6f;
    }

    .reset-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #7c998e;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="badge">Instant Store Reward</div>
    <h1>Pick a Lucky Card</h1>
    <p class="subtitle">Tap one card below to reveal your instant discount up to <strong>ZMW 1,000 OFF</strong>!</p>
  </div>

  <div class="cards-grid" id="cardsGrid">
    <div class="card" onclick="pickCard(0)">
      <div class="card-face card-front">
        <div class="card-icon">👑</div>
        <div class="card-label">Card #1</div>
      </div>
      <div class="card-face card-back" id="back-0"></div>
    </div>

    <div class="card" onclick="pickCard(1)">
      <div class="card-face card-front">
        <div class="card-icon">💎</div>
        <div class="card-label">Card #2</div>
      </div>
      <div class="card-face card-back" id="back-1"></div>
    </div>

    <div class="card" onclick="pickCard(2)">
      <div class="card-face card-front">
        <div class="card-icon">✨</div>
        <div class="card-label">Card #3</div>
      </div>
      <div class="card-face card-back" id="back-2"></div>
    </div>

    <div class="card" onclick="pickCard(3)">
      <div class="card-face card-front">
        <div class="card-icon">🎁</div>
        <div class="card-label">Card #4</div>
      </div>
      <div class="card-face card-back" id="back-3"></div>
    </div>
  </div>

  <div class="result-box" id="resultBox">
    <div class="voucher-label">Show this screen at checkout</div>
    <div class="voucher-code" id="voucherCode">ZMW100-XXXX</div>
    <div class="live-badge">
      <span class="dot"></span>
      <span id="liveClock">Live Verification</span>
    </div>
    <p class="terms">Valid today only • One draw per customer</p>
  </div>

  <div class="footer">
    <span>VIP Customer Promo</span>
    <button class="reset-btn" onclick="staffReset()">Staff Reset</button>
  </div>

  <script>
    const STORAGE_KEY = "zmw_card_draw_v2";

    // Weighted prizes (Total = 100%)
    const PRIZES = [
      { amount: 100, weight: 45 },
      { amount: 200, weight: 25 },
      { amount: 300, weight: 15 },
      { amount: 500, weight: 10 },
      { amount: 1000, weight: 5 }
    ];

    function getWeightedPrize() {
      const rand = Math.random() * 100;
      let cumulative = 0;
      for (const p of PRIZES) {
        cumulative += p.weight;
        if (rand < cumulative) return p.amount;
      }
      return 100;
    }

    function generateCode(amount) {
      const chars = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";
      let suffix = "";
      for (let i = 0; i < 4; i++) {
        suffix += chars.charAt(Math.floor(Math.random() * chars.length));
      }
      return `ZMW${amount}-${suffix}`;
    }

    function renderResult(cardIndex, amount, code) {
      const cards = document.querySelectorAll(".card");
      cards.forEach((card, idx) => {
        if (idx === cardIndex) {
          document.getElementById(`back-${idx}`).innerHTML = `
            <div class="win-title">You Won</div>
            <div class="win-amount">ZMW ${amount.toLocaleString()}</div>
            <div class="win-off">DISCOUNT</div>
          `;
          card.classList.add("flipped");
        } else {
          card.classList.add("dimmed");
        }
      });

      document.getElementById("voucherCode").textContent = code;
      document.getElementById("resultBox").classList.add("visible");
    }

    function pickCard(index) {
      if (localStorage.getItem(STORAGE_KEY)) return;
      const wonAmount = getWeightedPrize();
      const code = generateCode(wonAmount);
      const data = { cardIndex: index, amount: wonAmount, code: code };
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      renderResult(index, wonAmount, code);
    }

    function staffReset() {
      localStorage.removeItem(STORAGE_KEY);
      location.reload();
    }

    function updateClock() {
      const now = new Date();
      const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      const dateStr = now.toLocaleDateString([], { day: '2-digit', month: 'short' });
      document.getElementById("liveClock").textContent = `Valid Now • ${dateStr} ${timeStr}`;
    }

    // Restore state if already played
    window.addEventListener("DOMContentLoaded", () => {
      updateClock();
      setInterval(updateClock, 1000);
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const { cardIndex, amount, code } = JSON.parse(saved);
          renderResult(cardIndex, amount, code);
        } catch (e) {
          localStorage.removeItem(STORAGE_KEY);
        }
      }
    });
  </script>
</body>
</html>
