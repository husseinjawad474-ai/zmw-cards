<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>G LINK | VIP Card Draw</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #1f1a0d 0%, #0b0a07 58%, #040403 100%);
      color: #f8f3e3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 24px 16px 16px;
      overflow-x: hidden;
    }

    .header {
      text-align: center;
      max-width: 420px;
      margin-bottom: 16px;
    }

    .brand-box {
      margin-bottom: 10px;
    }

    .brand-name {
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 3px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #fff3c4 0%, #d4af37 50%, #9e7416 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-tagline {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #d4af37;
      opacity: 0.85;
      margin-top: 2px;
    }

    .badge {
      display: inline-block;
      background: rgba(212, 175, 55, 0.14);
      border: 1px solid rgba(212, 175, 55, 0.55);
      color: #f5d76e;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      padding: 5px 14px;
      border-radius: 50px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(135deg, #fff7d6 0%, #e5be46 52%, #a87b18 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: #cbbd93;
      line-height: 1.4;
    }

    .subtitle strong {
      color: #f5d76e;
    }

    .cards-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 14px;
      width: 100%;
      max-width: 360px;
      margin: 12px auto;
      perspective: 1000px;
    }

    .card {
      aspect-ratio: 3 / 4;
      position: relative;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    }

    .card.flipped {
      transform: rotateY(180deg);
    }

    .card.dimmed {
      opacity: 0.3;
      pointer-events: none;
      transform: scale(0.95);
    }

    .card-face {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 14px;
      text-align: center;
      box-shadow: 0 14px 30px rgba(0, 0, 0, 0.75);
    }

    .card-front {
      background: linear-gradient(145deg, #1b1811 0%, #0b0a07 100%);
      border: 2px solid #d4af37;
    }

    .card-front::before {
      content: "";
      position: absolute;
      inset: 7px;
      border: 1px dashed rgba(212, 175, 55, 0.5);
      border-radius: 10px;
    }

    .card-icon {
      font-size: 32px;
      margin-bottom: 8px;
      filter: drop-shadow(0 2px 8px rgba(212, 175, 55, 0.45));
    }

    .card-label {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1.2px;
      color: #f5d76e;
      text-transform: uppercase;
    }

    .card-back {
      background: linear-gradient(145deg, #fff8dc 0%, #e7c252 100%);
      color: #12100a;
      border: 3px solid #d4af37;
      transform: rotateY(180deg);
    }

    .win-title {
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #3a2b06;
      margin-bottom: 4px;
    }

    .win-amount {
      font-size: 24px;
      font-weight: 900;
      color: #0b0a07;
      line-height: 1.1;
    }

    .win-off {
      font-size: 13px;
      font-weight: 900;
      color: #7a5607;
      margin-top: 3px;
    }

    .result-box {
      display: none;
      width: 100%;
      max-width: 360px;

      border: 1px solid rgba(212, 175
